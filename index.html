<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư mục Đại Học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE4; --paper-line:#DCD5C2;
    --ink:#1E1B16; --ink-soft:#5C5548;
    --default-color: #4A5568; --default-soft: #EDF2F7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif; line-height:1.5;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 37px, var(--paper-line) 38px);
    opacity:0.4; pointer-events:none;
  }
  header{ max-width:920px; margin:0 auto; padding:64px 28px 32px; position:relative; }
  .kicker{ font-size:14px; color:var(--ink-soft); margin:0 0 6px; }
  h1{ font-family:'Source Serif 4', serif; font-weight:700; font-size:clamp(36px,6vw,56px); margin:0 0 14px; letter-spacing:-0.01em; }
  header p.sub{ max-width:56ch; color:var(--ink-soft); font-size:16px; margin:0; }
  main{ max-width:920px; margin:0 auto; padding:0 28px 100px; }
  section.subject{ margin-top:56px; }
  .subject-head{ display:flex; align-items:baseline; gap:16px; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:22px; }
  .subject-head h2{ font-family:'Source Serif 4', serif; font-style:italic; font-weight:600; font-size:30px; margin:0; }
  .subject-head .count{ font-size:14px; color:var(--ink-soft); }
  .docs{ display:grid; grid-template-columns:1fr; gap:2px; background:var(--paper-line); border:1px solid var(--paper-line); }
  .doc{ display:flex; align-items:center; gap:18px; background:var(--paper); padding:18px 20px; text-decoration:none; color:inherit; transition:background 0.15s ease, padding-left 0.15s ease; }
  .doc:hover{ padding-left:26px; background:var(--default-soft); }
  .doc .filetype{ flex:none; width:42px; height:42px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; letter-spacing:0.02em; color:#fff; background:var(--default-color); text-transform: uppercase; }
  .doc .meta{ flex:1; min-width:0; }
  .doc .name{ font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display: block; }
  .doc .desc{ font-size:13px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display: block; }
  .doc .arrow{ flex:none; font-size:20px; color:var(--ink-soft); }
  footer{ max-width:920px; margin:0 auto; padding:0 28px 60px; color:var(--ink-soft); font-size:13px; }
  #loading { text-align: center; padding: 40px; font-style: italic; color: var(--ink-soft); }
  @media (max-width:520px){ .doc .desc{ display:none; } }
</style>
</head>
<body>

<header>
  <p class="kicker">Google Drive — Tài liệu</p>
  <h1>Ghi chép &amp; tài liệu</h1>
  <p class="sub">Mục lục các môn học và tài liệu đang lưu trong thư mục. Dữ liệu được đồng bộ trực tiếp từ Google Drive. Bấm vào một tài liệu để xem.</p>
</header>

<main id="app-container">
  <div id="loading">Đang tải dữ liệu từ Google Drive...</div>
</main>

<footer>
  Được tạo tự động từ nội dung thư mục trên Google Drive.
</footer>

  function getFileIconText(mimeType, name) {
    if (mimeType.includes('pdf')) return 'PDF';
    if (mimeType.includes('document') || mimeType.includes('word')) return 'DOC';
    if (mimeType.includes('spreadsheet') || mimeType.includes('excel')) return 'XLS';
    if (mimeType.includes('presentation') || mimeType.includes('powerpoint')) return 'PPT';
    if (mimeType.includes('image') || mimeType.includes('jpeg') || mimeType.includes('png')) return 'IMG';
    if (mimeType.includes('video')) return 'VID';
    if (mimeType.includes('audio')) return 'AUD';
    if (mimeType.includes('text')) return 'TXT';
    if (mimeType.includes('folder')) return 'DIR';
    
    const parts = name.split('.');
    if (parts.length > 1) return parts[parts.length - 1].toUpperCase().substring(0, 3);
    return 'FILE';
  }
  
  // Bảng màu cho từng môn học (Thư mục con)
  const colors = [
    { bg: '#28456B', hover: '#E4EAF1' }, // Xanh dương đậm
    { bg: '#7A2E22', hover: '#F1E4DF' }, // Đỏ nâu
    { bg: '#2B6CB0', hover: '#EBF8FF' }, // Xanh lam
    { bg: '#2F855A', hover: '#F0FFF4' }, // Xanh lá
    { bg: '#C05621', hover: '#FFFAF0' }, // Cam
    { bg: '#805AD5', hover: '#FAF5FF' }, // Tím
    { bg: '#D69E2E', hover: '#FFFFF0' }  // Vàng
  ];

  function renderData(data) {
    const container = document.getElementById('app-container');
    container.innerHTML = '';
    
    if (data.length === 0) {
      container.innerHTML = '<div id="loading">Thư mục trống hoặc không có quyền truy cập.</div>';
      return;
    }
    
    data.forEach((subject, index) => {
      const colorObj = colors[index % colors.length];
      const sectionId = 'subject-' + index;
      
      const section = document.createElement('section');
      section.className = 'subject';
      section.id = sectionId;
      
      // Cấp phát CSS theo màu môn học
      const subjectStyle = document.createElement('style');
      subjectStyle.innerHTML = `
        #${sectionId} .doc:hover { background: ${colorObj.hover} !important; }
        #${sectionId} .filetype { background: ${colorObj.bg} !important; }
      `;
      document.head.appendChild(subjectStyle);
      
      let docsHtml = '';
      subject.files.forEach(file => {
        const typeText = getFileIconText(file.mimeType, file.name);
        let displayName = file.name;
        
        // Cắt bớt phần đuôi file (.pdf, .docx, v.v.) khỏi tên hiển thị để đẹp hơn
        const lastDot = displayName.lastIndexOf('.');
        if (lastDot > 0 && displayName.length - lastDot <= 5) {
            displayName = displayName.substring(0, lastDot);
        }

        const desc = file.description || (typeText + ' File');
        
        docsHtml += `
          <a class="doc" href="${file.url}" target="_blank" rel="noopener">
            <span class="filetype">${typeText}</span>
            <span class="meta">
              <span class="name" title="${file.name}">${displayName}</span>
              <span class="desc" title="${desc}">${desc}</span>
            </span>
            <span class="arrow">↗</span>
          </a>
        `;
      });
      
      section.innerHTML = `
        <div class="subject-head">
          <h2>${subject.name}</h2>
          <span class="count">${subject.files.length} tài liệu</span>
        </div>
        <div class="docs">
          ${docsHtml}
        </div>
      `;
      container.appendChild(section);
    });
  }

  async function loadDriveData() {
    try {
      if (SCRIPT_URL === "") {
        // Nếu người dùng chưa điền URL, sử dụng dữ liệu dự phòng (JSON bạn gửi) để xem trước
        console.log("Đang sử dụng dữ liệu mẫu vì SCRIPT_URL chưa được thiết lập.");
        renderData(FALLBACK_DATA);
        
        // Hiện thông báo nhỏ
        const msg = document.createElement('div');
        msg.style = "background: #fff3cd; color: #856404; padding: 10px 20px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; border: 1px solid #ffeeba;";
        msg.innerHTML = "<strong>Đang hiển thị dữ liệu xem trước (Mẫu).</strong> Để trang tự động cập nhật, bạn nhớ thay đổi <code>SCRIPT_URL</code> trong file HTML nhé.";
        document.getElementById('app-container').prepend(msg);
        
        return;
      }
      
      const response = await fetch(SCRIPT_URL + "?t=" + new Date().getTime(), { cache: "no-store" });
      const data = await response.json();
      
      renderData(data);
    } catch (error) {
      console.error(error);
      document.getElementById('loading').innerHTML = `
          <div style="color: #721c24; border: 1px solid #f5c6cb; padding: 20px; border-radius: 8px; background: #f8d7da;">
            <strong>Lỗi khi lấy dữ liệu trực tiếp:</strong> ${error.message}<br><br>
            Hãy kiểm tra xem Web App URL đã copy đúng chưa, và quyền truy cập của Google Apps Script đã được thiết lập là <b>"Anyone" (Bất kỳ ai)</b> chưa.
          </div>
      `;
      // Vẫn hiển thị dữ liệu mẫu để web không trống trơn
      renderData(FALLBACK_DATA);
    }
  }
  
  loadDriveData();
</script>
